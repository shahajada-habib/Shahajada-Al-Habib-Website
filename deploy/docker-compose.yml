# The site on the VM, against the existing managed (Aiven) MySQL. No database
# container here on purpose — a 1 GB e2-micro cannot comfortably host MySQL +
# the JVM.
#
# The image is built by GitHub Actions (.github/workflows/build-and-push.yml),
# not on the VM: running `mvn clean package` here competed with the live app
# for this box's 1 GB of RAM and pushed it into swap badly enough that a
# routine deploy once took over 5 minutes to boot (2026-09-16). Day to day:
#   git pull && docker compose pull && docker compose up -d
# `docker compose pull` just downloads the finished image — no compiling.
#
# One-time fallback if GHCR is ever unreachable — build elsewhere and load it:
#   docker build -t shahajada-site:local ./backend   (on a machine with RAM to spare)
#   docker save shahajada-site:local | gzip > site.tar.gz && scp it to the VM
#   gunzip -c site.tar.gz | docker load
#   then set `image: shahajada-site:local` below in place of the ghcr.io tag
#
# Milestone 2 (HTTPS): point a DNS A record at this VM, open TCP 443, then
#   git pull && bash enable-https.sh <domain>
#   -> that script sets WEB_HTTP_PORT / SITE_DOMAIN / COMPOSE_PROFILES in .env
#      so the app moves behind Caddy, which terminates TLS automatically.
#
# Note: the prod profile requires SITE_URL to be an https:// value even in
# Milestone 1 (Caddy has no cert yet, but http://<VM_IP> still works for tests).

services:
  web:
    image: ghcr.io/shahajada-habib/shahajada-al-habib-website:latest
    container_name: shahajada-site
    restart: unless-stopped
    env_file: .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      PORT: "8083"
      # 1 GB box: cap the heap and use the low-overhead collector. Exit (and let
      # Docker restart) on OOM rather than limping along in a bad state.
      JAVA_TOOL_OPTIONS: "-XX:MaxRAMPercentage=45.0 -XX:+UseSerialGC -XX:+ExitOnOutOfMemoryError"
    ports:
      # M1: "0.0.0.0:80:8083" (public). M2: enable-https.sh sets
      # WEB_HTTP_PORT=127.0.0.1:8083 so only Caddy is exposed publicly.
      - "${WEB_HTTP_PORT:-0.0.0.0:80}:8083"
    volumes:
      # Uploaded media persists across rebuilds. This disk is separate from
      # Render's — images uploaded here won't appear on Render and vice versa.
      - uploads:/app/uploads

  caddy:
    # Only started when COMPOSE_PROFILES=tls (enable-https.sh sets that in .env).
    profiles: ["tls"]
    image: caddy:2-alpine
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_DOMAIN: "${SITE_DOMAIN:-}"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  uploads:
  caddy_data:
  caddy_config:
