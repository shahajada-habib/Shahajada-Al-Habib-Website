spring.application.name=shahajada-writing-studio
server.port=8083
# Profiles:
# dev = temporary in-memory H2 database that resets on each backend restart.
# mysql-dev = persistent local MySQL database for realistic development testing.
# prod = production MySQL database with environment-provided credentials.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

app.jwt.secret=${JWT_SECRET:shahajada-writing-studio-development-secret-change-before-production}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:*,http://127.0.0.1:*}
app.site-url=${SITE_URL:http://localhost:8083}
app.seed.default-users.enabled=${SEED_DEFAULT_USERS_ENABLED:false}
app.seed.default-password=${SEED_DEFAULT_PASSWORD:1234}
app.seed.default-users.reset-password=${SEED_DEFAULT_USERS_RESET_PASSWORD:false}
app.rate-limit.login-per-minute=${RATE_LIMIT_LOGIN_PER_MINUTE:15}
app.media.upload-dir=${MEDIA_UPLOAD_DIR:uploads}
app.media.max-file-size-bytes=${MEDIA_MAX_FILE_SIZE_BYTES:5242880}
spring.servlet.multipart.max-file-size=${MEDIA_MAX_FILE_SIZE:5MB}
spring.servlet.multipart.max-request-size=${MEDIA_MAX_REQUEST_SIZE:6MB}
server.error.include-stacktrace=never
server.error.include-message=never
