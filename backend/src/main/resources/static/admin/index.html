<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — শাহজাদা আল হাবীব</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div id="login-view">
  <div style="min-height:100vh; display:flex; align-items:center; justify-content:center;">
    <form id="login-form" class="form-card">
      <h2 style="margin-bottom:18px;">অ্যাডমিন লগইন</h2>
      <div class="form-group">
        <label>Username</label>
        <input type="text" name="username" required value="admin">
      </div>
      <div class="form-group">
        <label>Password</label>
        <input type="password" name="password" required>
      </div>
      <button type="submit" class="btn btn--primary btn--block">লগইন</button>
      <p class="form-error" id="login-error"></p>
      <p class="form-note">Default seed login: admin / 1234 (dev profile)</p>
    </form>
  </div>
</div>

<div id="dashboard-view" style="display:none;">
  <header class="admin-header">
    <div class="container admin-header__inner">
      <span class="logo">শাহজাদা আল হাবীব Admin</span>
      <div>
        <a href="/" target="_blank" class="btn btn--ghost btn--sm">সাইট দেখুন</a>
        <button class="btn btn--ghost btn--sm" id="logout-btn">লগআউট</button>
      </div>
    </div>
  </header>

  <div class="container" style="padding-top:24px; padding-bottom: 60px;">
    <div class="tabs">
      <button class="tab-btn active" data-tab="dashboard">Dashboard</button>
      <button class="tab-btn" data-tab="articles">লেখা</button>
      <button class="tab-btn" data-tab="comments">মন্তব্য</button>
      <button class="tab-btn" data-tab="categories">ক্যাটাগরি</button>
      <button class="tab-btn" data-tab="media">মিডিয়া লাইব্রেরি</button>
    </div>

    <!-- Dashboard -->
    <div class="tab-panel active" id="dashboard-panel">
      <div class="stat-grid" id="stat-grid"></div>
      <div id="dashboard-lists"></div>
    </div>

    <!-- Articles -->
    <div class="tab-panel" id="articles-panel">
      <div class="admin-panel-head">
        <h2>লেখা</h2>
        <button class="btn btn--primary btn--sm" id="new-article-btn">+ নতুন লেখা</button>
      </div>

      <form id="article-form" class="admin-form-card">
        <input type="hidden" name="id">
        <div class="form-grid">
          <div class="form-group" style="grid-column: 1 / -1;">
            <label>শিরোনাম</label>
            <input type="text" name="title" id="article-title" required>
          </div>
          <div class="form-group" style="grid-column: 1 / -1;">
            <label>সাব-টাইটেল</label>
            <input type="text" name="subtitle">
          </div>
          <div class="form-group">
            <label>Slug (URL)</label>
            <input type="text" name="slug" id="article-slug" required>
          </div>
          <div class="form-group">
            <label>ক্যাটাগরি</label>
            <select name="category" id="article-category" required></select>
          </div>
          <div class="form-group">
            <label>Status</label>
            <select name="status">
              <option value="draft">Draft</option>
              <option value="review">Review</option>
              <option value="published">Published</option>
              <option value="archived">Archived</option>
            </select>
          </div>
          <div class="form-group">
            <label>প্রকাশের তারিখ</label>
            <input type="datetime-local" name="publishDate">
          </div>
        </div>

        <div class="form-group">
          <label>লেখা</label>
          <div id="content-editor"></div>
        </div>

        <div class="form-grid">
          <div class="form-group" style="grid-column: 1 / -1;">
            <label>YouTube ভিডিও লিংক (ঐচ্ছিক)</label>
            <input type="text" name="videoUrl" placeholder="https://www.youtube.com/watch?v=...">
          </div>
          <div class="form-group">
            <label>মূল প্রকাশ/সোর্স (ঐচ্ছিক)</label>
            <input type="text" name="source" placeholder="যেমন: দৈনিক পত্রিকার নাম">
          </div>
          <div class="form-group">
            <label>ট্যাগ (কমা দিয়ে আলাদা)</label>
            <input type="text" name="tags" placeholder="ভালোবাসা, বিরহ">
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group" style="grid-column: 1 / -1;">
            <label>ছবির URL <button type="button" class="btn btn--ghost btn--sm" id="pick-image-btn" style="margin-left:8px;">মিডিয়া লাইব্রেরি থেকে বেছে নিন</button></label>
            <input type="text" name="imageUrl" id="article-image-url">
          </div>
          <div class="form-group">
            <label>Image alt text</label>
            <input type="text" name="imageAlt">
          </div>
          <div class="form-group">
            <label>ছবির ক্রেডিট</label>
            <input type="text" name="imageSource">
          </div>
          <div class="form-group" style="grid-column: 1 / -1;">
            <label>ছবির ক্যাপশন</label>
            <input type="text" name="imageCaption">
          </div>
        </div>

        <div class="form-grid">
          <div class="form-group">
            <label>SEO title</label>
            <input type="text" name="seoTitle">
          </div>
          <div class="form-group">
            <label>SEO description</label>
            <input type="text" name="seoDescription">
          </div>
        </div>

        <div style="display:flex; gap:20px; margin: 10px 0 16px;">
          <div class="checkbox-row"><input type="checkbox" name="featured" id="article-featured"><label for="article-featured">হোমপেজে ফিচার্ড করুন</label></div>
        </div>

        <div style="display:flex; gap:10px;">
          <button type="submit" class="btn btn--primary btn--sm">সংরক্ষণ করুন</button>
          <button type="button" class="btn btn--ghost btn--sm" id="cancel-article-btn">বাতিল</button>
        </div>
        <p class="form-error" id="article-form-error"></p>
      </form>

      <div id="articles-table-wrap"></div>
    </div>

    <!-- Comments -->
    <div class="tab-panel" id="comments-panel">
      <div class="admin-panel-head"><h2>মন্তব্য</h2></div>
      <div id="comments-table-wrap"></div>
    </div>

    <!-- Categories -->
    <div class="tab-panel" id="categories-panel">
      <div class="admin-panel-head"><h2>ক্যাটাগরি</h2></div>
      <form id="category-form" class="admin-form-card open" style="margin-bottom:20px;">
        <div class="form-grid">
          <div class="form-group"><label>নাম</label><input type="text" name="name" required></div>
          <div class="form-group"><label>Slug</label><input type="text" name="slug" required></div>
        </div>
        <button type="submit" class="btn btn--primary btn--sm">ক্যাটাগরি যোগ করুন</button>
        <p class="form-error" id="category-form-error"></p>
      </form>
      <div id="categories-table-wrap"></div>
    </div>

    <!-- Media -->
    <div class="tab-panel" id="media-panel">
      <div class="admin-panel-head">
        <h2>মিডিয়া লাইব্রেরি</h2>
        <div>
          <input type="file" id="media-file-input" accept="image/*" multiple style="display:none;">
          <button class="btn btn--primary btn--sm" id="media-upload-btn">+ ছবি আপলোড</button>
        </div>
      </div>
      <p class="form-error" id="media-form-error"></p>
      <div class="media-grid" id="media-grid"></div>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
