# H2 DATABASE (DEFAULT DEV ONLY)
# Temporary reset database for fast debugging.
# Data is lost after backend restart because this profile uses in-memory H2 and create-drop.
# Use mysql-dev when persistent local MySQL data is needed.
spring.datasource.url=jdbc:h2:mem:writing-studio-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true

# Disable Flyway for H2 dev because migrations are MySQL-oriented.
spring.flyway.enabled=false

# Seeder
app.seed.default-users.enabled=true
app.seed.default-password=1234
app.seed.default-users.reset-password=true
