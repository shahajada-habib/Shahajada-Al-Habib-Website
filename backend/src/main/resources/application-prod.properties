# PRODUCTION MYSQL DATABASE
# Use this profile only with real environment-provided credentials and a persistent upload directory.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Flyway remains enabled from application.properties; Hibernate only validates the migrated schema.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:3600}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
app.site-url=${SITE_URL}
app.media.upload-dir=${MEDIA_UPLOAD_DIR}
app.seed.default-users.enabled=${SEED_DEFAULT_USERS_ENABLED:false}
app.seed.default-password=${SEED_DEFAULT_PASSWORD:}
app.seed.default-users.reset-password=${SEED_DEFAULT_USERS_RESET_PASSWORD:false}
