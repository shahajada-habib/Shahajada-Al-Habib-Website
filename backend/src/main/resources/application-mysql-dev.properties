# MYSQL DEV DATABASE (PERSISTENT DEVELOPMENT)
# Run with: SPRING_PROFILES_ACTIVE=mysql-dev
# Unlike the default dev profile, this keeps data after backend restart, and can point at
# either a local MySQL install or a shared cloud database (see secrets.properties.example).
#
# Real credentials go in secrets.properties (gitignored, never committed) instead of here.
spring.config.import=optional:file:./secrets.properties

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/shahajada_writing_studio?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Use Flyway migrations as the source of truth for MySQL schema.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Only creates admin/editor/reporter if they don't exist yet -- never resets an existing
# password on restart, since this profile now points at persistent (real) data.
app.seed.default-users.enabled=true
app.seed.default-password=${SEED_DEFAULT_PASSWORD:1234}
app.seed.default-users.reset-password=false

app.jwt.secret=${JWT_SECRET:blog-cms-boilerplate-mysql-dev-secret-change-before-production}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:86400}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4210,http://127.0.0.1:4210}
app.media.upload-dir=${MEDIA_UPLOAD_DIR:uploads}
