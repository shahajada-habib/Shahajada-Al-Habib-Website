<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!--/* Reusable <head> fragment: every page calls this with its own title/description/image/url
     so search engines and social-share bots get correct per-page metadata server-rendered. */-->
<head th:fragment="head(title, description, image, url)">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title th:text="${title} + ' | শাহজাদা আল হাবীব'">শাহজাদা আল হাবীব</title>
  <meta name="description" th:content="${description}" />
  <link rel="canonical" th:href="@{${url}}" />

  <meta property="og:type" content="article" />
  <meta property="og:title" th:content="${title}" />
  <meta property="og:description" th:content="${description}" />
  <meta property="og:url" th:content="@{${url}}" />
  <meta property="og:image" th:if="${!#strings.isEmpty(image)}" th:content="${image}" />
  <meta name="twitter:card" content="summary_large_image" />

  <link rel="alternate" type="application/rss+xml" title="শাহজাদা আল হাবীব RSS" href="/rss.xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Bengali:wght@400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/style.css" />
  <script>
    (function () {
      var saved = localStorage.getItem('site-theme');
      if (saved === 'dark') { document.documentElement.setAttribute('data-theme', 'dark'); }
    })();
  </script>
</head>
<body>

<div th:fragment="header">
  <header class="site-header">
    <div class="container site-header__top">
      <a href="/" class="logo">শাহজাদা আল হাবীব</a>
      <form class="search-form" action="/search" method="get">
        <input type="text" name="q" th:placeholder="#{search.placeholder}" />
        <button type="submit" th:text="#{search.button}">Search</button>
      </form>
      <div class="header-controls">
        <div class="lang-switch">
          <a href="?lang=bn" th:classappend="${#locale.language == 'bn'} ? 'active'" th:text="#{lang.bn}">বাংলা</a>
          <span>/</span>
          <a href="?lang=en" th:classappend="${#locale.language == 'en'} ? 'active'" th:text="#{lang.en}">English</a>
        </div>
        <button type="button" id="theme-toggle" class="theme-toggle" aria-label="Toggle dark mode">🌙</button>
      </div>
    </div>
    <nav class="site-nav">
      <div class="container">
        <ul>
          <li><a href="/" th:text="#{nav.home}">হোম</a></li>
          <li th:each="cat : ${navCategories}" th:if="${cat.slug != 'gallery'}">
            <a th:href="@{'/category/' + ${cat.slug}}" th:text="${cat.name}">Category</a>
          </li>
          <li><a href="/gallery" th:text="#{nav.gallery}">গ্যালারি</a></li>
          <li><a href="/about" th:text="#{nav.about}">আমার সম্পর্কে</a></li>
          <li><a href="https://shahajada-habib.github.io/portfolio/" target="_blank" rel="noopener" th:text="#{nav.portfolio}">টেক প্রোফাইল</a></li>
        </ul>
      </div>
    </nav>
  </header>
</div>

<footer class="site-footer" th:fragment="footer">
  <div class="container">
    <div>
      <a href="/" class="logo" style="font-size:1.1rem;">শাহজাদা আল হাবীব</a>
      <p class="footer-note" th:text="#{footer.tagline}">লেখক • কবি • ভ্রমণপিপাসু • সাইক্লিস্ট • ফটোগ্রাফার</p>
    </div>
    <div class="social-links">
      <a href="https://www.facebook.com/ShahajadaAlHabib" target="_blank" rel="noopener" aria-label="Facebook">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M22 12a10 10 0 1 0-11.56 9.88v-6.99H7.9V12h2.54V9.8c0-2.5 1.49-3.89 3.78-3.89 1.1 0 2.24.2 2.24.2v2.46h-1.26c-1.24 0-1.63.77-1.63 1.56V12h2.78l-.44 2.89h-2.34v6.99A10 10 0 0 0 22 12"/></svg>
      </a>
      <a href="https://www.instagram.com/pranto.habib" target="_blank" rel="noopener" aria-label="Instagram">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M12 2c2.72 0 3.06.01 4.12.06 1.06.05 1.79.22 2.43.47.66.26 1.21.6 1.77 1.15.55.56.9 1.11 1.15 1.77.25.64.42 1.37.47 2.43.05 1.06.06 1.4.06 4.12s-.01 3.06-.06 4.12c-.05 1.06-.22 1.79-.47 2.43a4.9 4.9 0 0 1-1.15 1.77 4.9 4.9 0 0 1-1.77 1.15c-.64.25-1.37.42-2.43.47-1.06.05-1.4.06-4.12.06s-3.06-.01-4.12-.06c-1.06-.05-1.79-.22-2.43-.47a4.9 4.9 0 0 1-1.77-1.15 4.9 4.9 0 0 1-1.15-1.77c-.25-.64-.42-1.37-.47-2.43C2.01 15.06 2 14.72 2 12s.01-3.06.06-4.12c.05-1.06.22-1.79.47-2.43.26-.66.6-1.21 1.15-1.77a4.9 4.9 0 0 1 1.77-1.15c.64-.25 1.37-.42 2.43-.47C8.94 2.01 9.28 2 12 2m0 1.8c-2.67 0-2.99.01-4.04.06-.97.04-1.5.2-1.85.34-.47.18-.8.4-1.15.75-.35.35-.57.68-.75 1.15-.14.35-.3.88-.34 1.85-.05 1.05-.06 1.37-.06 4.04s.01 2.99.06 4.04c.04.97.2 1.5.34 1.85.18.47.4.8.75 1.15.35.35.68.57 1.15.75.35.14.88.3 1.85.34 1.05.05 1.37.06 4.04.06s2.99-.01 4.04-.06c.97-.04 1.5-.2 1.85-.34.47-.18.8-.4 1.15-.75.35-.35.57-.68.75-1.15.14-.35.3-.88.34-1.85.05-1.05.06-1.37.06-4.04s-.01-2.99-.06-4.04c-.04-.97-.2-1.5-.34-1.85a3.1 3.1 0 0 0-.75-1.15 3.1 3.1 0 0 0-1.15-.75c-.35-.14-.88-.3-1.85-.34-1.05-.05-1.37-.06-4.04-.06M12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10m0 1.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4m5.2-2.4a1.17 1.17 0 1 1-2.33 0 1.17 1.17 0 0 1 2.33 0"/></svg>
      </a>
      <a href="https://www.youtube.com/@shahajadaalhabib" target="_blank" rel="noopener" aria-label="YouTube">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M23.5 6.2a3.02 3.02 0 0 0-2.12-2.14C19.51 3.5 12 3.5 12 3.5s-7.51 0-9.38.56A3.02 3.02 0 0 0 .5 6.2 31.6 31.6 0 0 0 0 12a31.6 31.6 0 0 0 .5 5.8 3.02 3.02 0 0 0 2.12 2.14c1.87.56 9.38.56 9.38.56s7.51 0 9.38-.56a3.02 3.02 0 0 0 2.12-2.14A31.6 31.6 0 0 0 24 12a31.6 31.6 0 0 0-.5-5.8M9.6 15.6V8.4l6.27 3.6z"/></svg>
      </a>
    </div>
    <p class="footer-note">&copy; <span th:text="${#dates.year(#dates.createNow())}">2026</span> শাহজাদা আল হাবীব</p>
  </div>
  <script>
    (function () {
      var btn = document.getElementById('theme-toggle');
      if (!btn) return;
      function applyIcon() {
        btn.textContent = document.documentElement.getAttribute('data-theme') === 'dark' ? '☀️' : '🌙';
      }
      applyIcon();
      btn.addEventListener('click', function () {
        var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        if (isDark) {
          document.documentElement.removeAttribute('data-theme');
          localStorage.setItem('site-theme', 'light');
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
          localStorage.setItem('site-theme', 'dark');
        }
        applyIcon();
      });
    })();
  </script>
</footer>

</body>
</html>
