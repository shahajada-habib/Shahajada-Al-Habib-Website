name: Build and push image

# Builds the backend's Docker image on GitHub's runners (plenty of RAM/CPU)
# and pushes it to GitHub Container Registry, so the 1 GB production VM never
# has to run `mvn clean package` itself — it only pulls a finished image. That
# Maven build competing with the live app for the VM's RAM is what pushed it
# into swap and made a routine deploy take over 5 minutes to boot (2026-09-16).
on:
  push:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/build-and-push.yml"
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Compute lowercase image name
        # GHCR/Docker image names must be lowercase; the GitHub repo name isn't.
        run: echo "IMAGE=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
